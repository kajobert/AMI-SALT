name: AMI-SALT CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-ledger-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q salt tests
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Validate JSON schema file
        run: python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('schemas/support_event.schema.json').read_text())
          print('support_event schema JSON: PASS')
          PY
